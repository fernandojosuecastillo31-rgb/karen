<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tus Flores Amarillas - Karen & Fernando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #1e261a 0%, #0c120a 60%, #050704 100%);
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    
    .bg-message {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Caveat', cursive;
      font-size: clamp(2rem, 6vw, 3rem);
      color: #fff3a8;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.7), 0 0 25px rgba(255, 170, 0, 0.4);
      letter-spacing: 1.5px;
      text-align: center;
      width: 90%;
      z-index: 2;
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% {
        opacity: 0.85;
        transform: translateX(-50%) scale(0.98);
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) scale(1.02);
        text-shadow: 0 0 22px rgba(255, 215, 0, 0.9), 0 0 35px rgba(255, 170, 0, 0.6);
      }
    }

    
    canvas#particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

  
    .glow-bg {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.18) 0%, rgba(255, 170, 0, 0.05) 50%, transparent 75%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }

   
    .pig-bg {
      position: absolute;
      bottom: 22px;
      right: 8%;
      width: 130px;
      height: 130px;
      z-index: 2;
      opacity: 0.92;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
      animation: gentleFloat 3.5s ease-in-out infinite alternate;
    }

    @keyframes gentleFloat {
      0% {
        transform: translateY(0) rotate(0deg);
      }
      100% {
        transform: translateY(-8px) rotate(2deg);
      }
    }

    .pig-ear-left {
      transform-origin: 32px 35px;
      animation: earWiggle 3s ease-in-out infinite;
    }

    .pig-ear-right {
      transform-origin: 88px 35px;
      animation: earWiggle 3s ease-in-out infinite 0.3s;
    }

    @keyframes earWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }

    
    .bouquet-container {
      position: relative;
      width: 100%;
      max-width: 520px;
      height: 75vh;
      min-height: 520px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 3;
    }

    .stems-svg {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .stem {
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: growStem 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .stem-main { stroke: #2d551e; animation-delay: 0.1s; }
    .stem-left { stroke: #274b1a; animation-delay: 0.3s; }
    .stem-right { stroke: #336122; animation-delay: 0.5s; }

    @keyframes growStem {
      to { stroke-dashoffset: 0; }
    }

    .leaf {
      fill: #2f5a20;
      transform-origin: bottom center;
      opacity: 0;
      transform: scale(0);
      animation: sproutLeaf 1.2s ease forwards;
    }

    .leaf-1 { animation-delay: 1.4s; }
    .leaf-2 { animation-delay: 1.7s; }
    .leaf-3 { animation-delay: 1.9s; }

    @keyframes sproutLeaf {
      to {
        opacity: 0.95;
        transform: scale(1);
      }
    }

    .flower {
      position: absolute;
      width: 140px;
      height: 140px;
      transform-origin: center center;
      opacity: 0;
      transform: scale(0) rotate(0deg);
      animation: bloom 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      cursor: pointer;
      transition: filter 0.3s ease;
    }

    .flower:hover {
      filter: drop-shadow(0 0 16px rgba(255, 223, 77, 0.8));
    }

    .flower-center {
      top: 18%;
      left: calc(50% - 70px);
      animation-delay: 1.8s;
    }

    .flower-left {
      top: 32%;
      left: calc(50% - 170px);
      animation-delay: 2.1s;
    }

    .flower-right {
      top: 30%;
      left: calc(50% + 30px);
      animation-delay: 2.4s;
    }

    @keyframes bloom {
      0% {
        opacity: 0;
        transform: scale(0) rotate(-20deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .lily-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    }

    
    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .btn {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.5);
      color: #fff9d2;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .btn:hover {
      background: rgba(255, 215, 0, 0.3);
      border-color: #ffd700;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.3);
    }

   
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .letter-card {
      background: #fdfbf7;
      color: #2b2b2b;
      width: 100%;
      max-width: 400px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 20px;
      padding: 30px 22px 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      border: 2px solid #ffd700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
      animation: slideUp 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    @keyframes slideUp {
      from { transform: translateY(30px) scale(0.95); }
      to { transform: translateY(0) scale(1); }
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: #777;
      cursor: pointer;
      line-height: 1;
    }

    .letter-title {
      font-family: 'Caveat', cursive;
      font-size: 2.3rem;
      color: #b8860b;
      text-align: center;
      line-height: 1;
    }

    .polaroid-frame {
      background: #ffffff;
      padding: 10px 10px 18px 10px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      border: 1px solid #eaeaea;
      transform: rotate(-1.5deg);
      transition: transform 0.3s ease;
      max-width: 260px;
      width: 100%;
    }

    .polaroid-frame:hover {
      transform: rotate(0deg) scale(1.02);
    }

    .polaroid-img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      object-position: center;
      border-radius: 6px;
      display: block;
    }

    .polaroid-caption {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: #666;
      text-align: center;
      margin-top: 8px;
    }

    .letter-body {
      font-family: 'Caveat', cursive;
      font-size: 1.55rem;
      line-height: 1.4;
      color: #3d3d3d;
      text-align: center;
      white-space: pre-wrap;
    }

    
    .touch-heart {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      animation: floatUp 1s ease-out forwards;
      z-index: 9999;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -120px) scale(1.4) rotate(15deg);
      }
    }
  </style>
</head>
<body>

      <div class="polaroid-frame">

    </div>
  </div>

  <script>
    
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 50;
        this.size = Math.random() * 2.5 + 1;
        this.speedY = Math.random() * 0.8 + 0.3;
        this.speedX = Math.sin(Math.random() * Math.PI * 2) * 0.4;
        this.opacity = Math.random() * 0.6 + 0.3;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 230, 100, ${this.opacity})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ffd700';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < 40; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

   
    const modal = document.getElementById('modalOverlay');

    function openCard() {
      modal.classList.add('active');
    }

    function closeCard() {
      modal.classList.remove('active');
    }

   
    const emojis = ['💛', '✨', '🐷', '🌼', '💛', '🌸'];

    function spawnTouchEffect(x, y) {
      const el = document.createElement('div');
      el.className = 'touch-heart';
      el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);

      setTimeout(() => {
        el.remove();
      }, 950);
    }

    window.addEventListener('click', (e) => {
      spawnTouchEffect(e.clientX, e.clientY);
    });

    window.addEventListener('touchstart', (e) => {
      for (let i = 0; i < e.touches.length; i++) {
        spawnTouchEffect(e.touches[i].clientX, e.touches[i].clientY);
      }
    }, { passive: true });
  </script>
