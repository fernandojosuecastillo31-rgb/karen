<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tus Flores Amarillas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #1e261a 0%, #0c120a 60%, #050704 100%);
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* Partículas de polen */
    canvas#particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Luces de fondo */
    .glow-bg {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.18) 0%, rgba(255, 170, 0, 0.05) 50%, transparent 75%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }

    /* Contenedor central del ramo */
    .bouquet-container {
      position: relative;
      width: 100%;
      max-width: 520px;
      height: 75vh;
      min-height: 520px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 2;
    }

    /* SVG de tallos y hojas */
    .stems-svg {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .stem {
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: growStem 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .stem-main { stroke: #2d551e; animation-delay: 0.1s; }
    .stem-left { stroke: #274b1a; animation-delay: 0.3s; }
    .stem-right { stroke: #336122; animation-delay: 0.5s; }

    @keyframes growStem {
      to { stroke-dashoffset: 0; }
    }

    .leaf {
      fill: #2f5a20;
      transform-origin: bottom center;
      opacity: 0;
      transform: scale(0);
      animation: sproutLeaf 1.2s ease forwards;
    }

    .leaf-1 { animation-delay: 1.4s; }
    .leaf-2 { animation-delay: 1.7s; }
    .leaf-3 { animation-delay: 1.9s; }

    @keyframes sproutLeaf {
      to {
        opacity: 0.95;
        transform: scale(1);
      }
    }

    /* Posicionamiento de las azucenas */
    .flower {
      position: absolute;
      width: 140px;
      height: 140px;
      transform-origin: center center;
      opacity: 0;
      transform: scale(0) rotate(0deg);
      animation: bloom 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      cursor: pointer;
      transition: filter 0.3s ease;
    }

    .flower:hover {
      filter: drop-shadow(0 0 16px rgba(255, 223, 77, 0.8));
    }

    /* Ubicaciones de las azucenas */
    .flower-center {
      top: 18%;
      left: calc(50% - 70px);
      animation-delay: 1.8s;
    }

    .flower-left {
      top: 32%;
      left: calc(50% - 170px);
      animation-delay: 2.1s;
    }

    .flower-right {
      top: 30%;
      left: calc(50% + 30px);
      animation-delay: 2.4s;
    }

    @keyframes bloom {
      0% {
        opacity: 0;
        transform: scale(0) rotate(-20deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .lily-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    }

    /* Botón centrado en pantalla */
    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .btn {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.5);
      color: #fff9d2;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .btn:hover {
      background: rgba(255, 215, 0, 0.3);
      border-color: #ffd700;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.3);
    }

    /* Ventana modal de la carta */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .letter-card {
      background: #fdfbf7;
      color: #2b2b2b;
      width: 100%;
      max-width: 440px;
      border-radius: 18px;
      padding: 35px 28px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      border: 2px solid #ffd700;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      animation: slideUp 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    @keyframes slideUp {
      from { transform: translateY(30px) scale(0.95); }
      to { transform: translateY(0) scale(1); }
    }

    .letter-title {
      font-family: 'Caveat', cursive;
      font-size: 2.3rem;
      color: #b8860b;
      text-align: center;
      line-height: 1;
    }

    .letter-body {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      line-height: 1.45;
      color: #3d3d3d;
      text-align: center;
      white-space: pre-wrap;
    }

    .close-modal {
      position: absolute;
      top: 12px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #777;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>

  <canvas id="particles"></canvas>
  <div class="glow-bg"></div>

  <!-- Estructura del ramo -->
  <div class="bouquet-container">
    <svg class="stems-svg" viewBox="0 0 400 600">
      <path class="stem stem-left" d="M200,580 Q160,400 90,260" />
      <path class="stem stem-main" d="M200,580 Q210,380 200,160" />
      <path class="stem stem-right" d="M200,580 Q230,420 290,240" />

      <path class="leaf leaf-1" d="M175,440 C120,430 100,390 90,370 C120,385 155,420 175,440 Z" />
      <path class="leaf leaf-2" d="M220,410 C270,395 295,350 310,330 C280,360 240,395 220,410 Z" />
      <path class="leaf leaf-3" d="M195,330 C150,300 135,260 130,240 C155,270 180,305 195,330 Z" />
    </svg>

    <!-- Flor Izquierda -->
    <div class="flower flower-left" onclick="openCard()">
      <svg class="lily-svg" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="petal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff59d"/>
            <stop offset="65%" stop-color="#fbc02d"/>
            <stop offset="100%" stop-color="#f57f17"/>
          </linearGradient>
        </defs>
        <path d="M50 50 C45 20 40 5 50 0 C60 5 55 20 50 50" fill="url(#petal-grad)" transform="rotate(-30 50 50)"/>
        <path d="M50 50 C45 20 40 5 50 0 C60 5 55 20 50 50" fill="url(#petal-grad)" transform="rotate(30 50 50)"/>
        <path d="M50 50 C45 20 40 5 50 0 C60 5 55 20 50 50" fill="url(#petal-grad)" transform="rotate(90 50 50)"/>
        <path d="M50 50 C45 20 40 5 50 0 C60 5 55 20 50 50" fill="url(#petal-grad)" transform="rotate(150 50 50)"/>
        <path d="M50 50 C45 20 40 5 50 0 C60 5 55 20 50 50" fill="url(#petal-grad)" transform="rotate(210 50 50)"/>
        <path d="M50 50 C45 20 40 5 50 0 C60 5 55 20 50 50" fill="url(#petal-grad)" transform="rotate(270 50 50)"/>
        <circle cx="50" cy="50" r="5" fill="#f57f17"/>
        <line x1="50" y1="50" x2="42" y2="38" stroke="#8d6e63" stroke-width="1.5"/>
        <line x1="50" y1="50" x2="58" y2="38" stroke="#8d6e63" stroke-width="1.5"/>
        <line x1="50" y1="50" x2="50" y2="34" stroke="#8d6e63" stroke-width="1.5"/>
        <circle cx="42" cy="38" r="2.5" fill="#5d4037"/>
        <circle cx="58" cy="38" r="2.5" fill="#5d4037"/>
        <circle cx="50" cy="34" r="2.5" fill="#5d4037"/>
      </svg>
    </div>

    <!-- Flor Central -->
    <div class="flower flower-center" onclick="openCard()">
      <svg class="lily-svg" viewBox="0 0 100 100">
        <path d="M50 50 C45 15 38 0 50 0 C62 0 55 15 50 50" fill="url(#petal-grad)" transform="rotate(0 50 50)"/>
        <path d="M50 50 C45 15 38 0 50 0 C62 0 55 15 50 50" fill="url(#petal-grad)" transform="rotate(60 50 50)"/>
        <path d="M50 50 C45 15 38 0 50 0 C62 0 55 15 50 50" fill="url(#petal-grad)" transform="rotate(120 50 50)"/>
        <path d="M50 50 C45 15 38 0 50 0 C62 0 55 15 50 50" fill="url(#petal-grad)" transform="rotate(180 50 50)"/>
        <path d="M50 50 C45 15 38 0 50 0 C62 0 55 15 50 50" fill="url(#petal-grad)" transform="rotate(240 50 50)"/>
        <path d="M50 50 C45 15 38 0 50 0 C62 0 55 15 50 50" fill="url(#petal-grad)" transform="rotate(300 50 50)"/>
        <circle cx="50" cy="50" r="6" fill="#f57f17"/>
        <line x1="50" y1="50" x2="40" y2="35" stroke="#795548" stroke-width="2"/>
        <line x1="50" y1="50" x2="60" y2="35" stroke="#795548" stroke-width="2"/>
        <line x1="50" y1="50" x2="50" y2="30" stroke="#795548" stroke-width="2"/>
        <ellipse cx="40" cy="35" rx="3.5" ry="2" fill="#4e342e"/>
        <ellipse cx="60" cy="35" rx="3.5" ry="2" fill="#4e342e"/>
        <ellipse cx="50" cy="30" rx="3.5" ry="2" fill="#4e342e"/>
      </svg>
    </div>

    <!-- Flor Derecha -->
    <div class="flower flower-right" onclick="openCard()">
      <svg class="lily-svg" viewBox="0 0 100 100">
        <path d="M50 50 C45 20 40 5 50 0 C60 5 55 20 50 50" fill="url(#petal-grad)" transform="rotate(20 50 50)"/>
        <path d="M50 50 C45 20 40 5 50 0 C60 5 55 20 50 50" fill="url(#petal-grad)" transform="rotate(80 50 50)"/>
        <path d="M50 50 C45 20 40 5 50 0 C60 5 55 20 50 50" fill="url(#petal-grad)" transform="rotate(140 50 50)"/>
        <path d="M50 50 C45 20 40 5 50 0 C60 5 55 20 50 50" fill="url(#petal-grad)" transform="rotate(200 50 50)"/>
        <path d="M50 50 C45 20 40 5 50 0 C60 5 55 20 50 50" fill="url(#petal-grad)" transform="rotate(260 50 50)"/>
        <path d="M50 50 C45 20 40 5 50 0 C60 5 55 20 50 50" fill="url(#petal-grad)" transform="rotate(320 50 50)"/>
        <circle cx="50" cy="50" r="5" fill="#f57f17"/>
        <line x1="50" y1="50" x2="44" y2="40" stroke="#8d6e63" stroke-width="1.5"/>
        <line x1="50" y1="50" x2="56" y2="38" stroke="#8d6e63" stroke-width="1.5"/>
        <circle cx="44" cy="40" r="2.5" fill="#5d4037"/>
        <circle cx="56" cy="38" r="2.5" fill="#5d4037"/>
      </svg>
    </div>
  </div>

  <!-- Botón abrir carta centrado -->
  <div class="controls">
    <button class="btn" onclick="openCard()">💌 Abrir Carta</button>
  </div>

  <!-- Modal con la carta romántica -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="letter-card">
      <button class="close-modal" onclick="closeCard()">×</button>
      <h2 class="letter-title">Para ti, mi amor</h2>
      <div class="letter-body">Estas azucenas amarillas florecen para recordarte lo especial que eres en mi vida. Gracias por iluminar cada uno de mis días con tu sonrisa. 💛</div>
    </div>
  </div>

  <script>
    // Animación de polen
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 50;
        this.size = Math.random() * 2.5 + 1;
        this.speedY = Math.random() * 0.8 + 0.3;
        this.speedX = Math.sin(Math.random() * Math.PI * 2) * 0.4;
        this.opacity = Math.random() * 0.6 + 0.3;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 230, 100, ${this.opacity})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ffd700';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < 45; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Abrir y cerrar la carta
    const modal = document.getElementById('modalOverlay');

    function openCard() {
      modal.classList.add('active');
    }

    function closeCard() {
      modal.classList.remove('active');
    }
  </script>
</body>
</html>
